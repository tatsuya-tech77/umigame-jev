<!doctype html>
<!-- Qiita 記事「作ってわかった5つのこと」の図。撮り方は docs/qiita-draft.md の先頭のコメント。
     スマホ幅（約360px）に縮んでも読めるように、幅720px・番号と見出しと数字だけにしている -->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>作ってわかった5つのこと</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #fffdf8; --ink: #1d1b16; --sub: #6b6558; --line: #e3ddd0;
    --accent: #0f766e; --accent-soft: #d6efec; --no: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 720px; padding: 24px; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  .row {
    display: grid; grid-template-columns: 56px 1fr 236px; align-items: center; gap: 18px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 16px;
    padding: 16px 18px; margin-bottom: 12px;
  }
  .row:last-of-type { margin-bottom: 0; }
  .no {
    width: 56px; height: 56px; border-radius: 12px; background: var(--accent); color: #fff;
    display: grid; place-items: center; font-size: 32px; font-weight: 800;
  }
  .what { font-size: 28px; font-weight: 800; line-height: 1.35; }
  .stat {
    background: var(--accent-soft); border-radius: 12px; padding: 10px 8px; text-align: center;
    font-size: 20px; font-weight: 600; color: var(--sub); line-height: 1.35;
  }
  .stat strong { display: block; font-size: 27px; font-weight: 800; color: var(--accent); line-height: 1.2; white-space: nowrap; }
  .stat strong.small { font-size: 24px; }
  .stat .term { font-size: 16px; white-space: nowrap; }
  .stat .bad { color: var(--no); }
  .stat .arrow { color: var(--sub); margin: 0 4px; }
</style>
</head>
<body>
  <div class="row">
    <div class="no">1</div>
    <div class="what">聞きたいことは<br>1回にまとめる</div>
    <div class="stat">質問が1つでも4つでも<strong>応答時間は同じ</strong>（約0.19秒）</div>
  </div>

  <div class="row">
    <div class="no">2</div>
    <div class="what">「はい」は<br>別の聞き方でも確認</div>
    <div class="stat">間違った「はい」<strong><span class="bad">3問</span><span class="arrow">→</span>0問</strong>（今は2問）</div>
  </div>

  <div class="row">
    <div class="no">3</div>
    <div class="what">指示の強制は<br>別に判定する</div>
    <div class="stat"><span class="term">プロンプトインジェクション</span><strong>15件すべて防止</strong></div>
  </div>

  <div class="row">
    <div class="no">4</div>
    <div class="what">前のやりとりは<br>判定に使わない</div>
    <div class="stat">つられた「はい」を<strong>「一部」に直す</strong></div>
  </div>

  <div class="row">
    <div class="no">5</div>
    <div class="what">真相にないことは<br>事実として足す</div>
    <div class="stat">書いていないと<strong class="small">関係ありません</strong></div>
  </div>
</body>
</html>
