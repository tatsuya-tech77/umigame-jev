<!doctype html>
<!-- Qiita 記事「作ってわかった5つのこと」の図。撮り方は docs/qiita-draft.md の先頭のコメント。
     スマホ幅（約360px）に縮んでも読めるように、幅720px・左＝やること、右の大きい字＝理由、右の小さい字＝数字 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>作ってわかった5つのこと</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #fffdf8; --ink: #1d1b16; --sub: #6b6558; --line: #e3ddd0;
    --accent: #0f766e; --accent-soft: #d6efec; --no: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 720px; padding: 24px; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  .row {
    display: grid; grid-template-columns: 56px 1fr 264px; align-items: center; gap: 18px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 16px;
    padding: 16px 18px; margin-bottom: 12px;
  }
  .row:last-of-type { margin-bottom: 0; }
  .no {
    width: 56px; height: 56px; border-radius: 12px; background: var(--accent); color: #fff;
    display: grid; place-items: center; font-size: 32px; font-weight: 800;
  }
  .what { font-size: 25px; font-weight: 800; line-height: 1.35; }
  .stat {
    background: var(--accent-soft); border-radius: 12px; padding: 12px 10px; text-align: center;
    color: var(--sub); font-size: 17px; font-weight: 600; line-height: 1.4;
  }
  .stat strong { display: block; font-size: 24px; font-weight: 800; color: var(--accent); line-height: 1.3; margin-bottom: 4px; }
  .stat strong.fit { font-size: 21px; white-space: nowrap; }
</style>
</head>
<body>
  <div class="row">
    <div class="no">1</div>
    <div class="what">判定したい項目は<br>1リクエストにまとめる</div>
    <div class="stat"><strong>質問を増やすほど<br>効率的</strong>1問でも4問でも約0.19秒</div>
  </div>

  <div class="row">
    <div class="no">2</div>
    <div class="what">「はい」は別の観点で<br>クロスチェック</div>
    <div class="stat"><strong>確率が高くても<br>誤判定する</strong>難しい問題では、0.7〜0.9の<br>「はい」の約半分が誤り</div>
  </div>

  <div class="row">
    <div class="no">3</div>
    <div class="what">指示が混ざっているかを<br>別に聞く</div>
    <div class="stat"><strong class="fit">プロンプト<br>インジェクション対策</strong>指示ひとつで<br>「いいえ」→「はい」になる</div>
  </div>

  <div class="row">
    <div class="no">4</div>
    <div class="what">前のやりとりは<br>判定に使わない</div>
    <div class="stat"><strong>前の「はい」に<br>つられる</strong>特に難しい問題で起きる</div>
  </div>

  <div class="row">
    <div class="no">5</div>
    <div class="what">暗黙の前提も<br>コンテキストに明記</div>
    <div class="stat"><strong>書いていないことは<br>推測しない</strong>真相にないことを聞くと<br>「関係ありません」</div>
  </div>
</body>
</html>
